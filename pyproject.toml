[project]
name = "mychef"
version = "0.0.0"
description = "Streamlit meal planning with Gemini and PostgreSQL"
requires-python = ">=3.15.2,<3.16"
dependencies = [
    "bcrypt==5.0.0",
    "cloudinary==1.46.3",
    "google-genai==2.33.0",
    "httpx==0.28.1",
    "pandas==3.1.0",
    "psycopg[binary]==3.3.6",
    "SQLAlchemy==2.1.6",
    "streamlit==1.66.1",
]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "playwright==1.64.1",
    "pytest==9.1.1",
]

[tool.uv]
package = false
required-version = "==0.13.5"
